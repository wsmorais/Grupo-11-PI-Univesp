{% extends 'core/base.html' %}

{% block content %}
<div class="container my-5">
    <h2 class="fw-bold mb-4">Minhas Oportunidades Cadastradas</h2>

    <div class="row g-4">
        {% for vaga in vagas %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm rounded-4 p-3 bg-white">
                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold text-dark">{{ vaga.titulo }}</h5>
                        <p class="text-muted small flex-grow-1">{{ vaga.descricao }}</p>
                        <p class="text-muted extra-small mb-2">
                            <i class="bi bi-geo-alt-fill text-danger me-1"></i>{{ vaga.local }}
                        </p>

                        <!-- INSERIR O BLOCO DE BOTÕES AQUI -->
                        <div class="d-flex gap-2 mt-3">
                            <a href="{% url 'editar_oportunidade' vaga.id %}" class="btn btn-outline-primary btn-sm flex-fill">
                                <i class="bi bi-pencil me-1"></i>Editar
                            </a>
                            <a href="{% url 'deletar_oportunidade' vaga.id %}" class="btn btn-outline-danger btn-sm flex-fill">
                                <i class="bi bi-trash me-1"></i>Excluir
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-muted fs-5">Você ainda não cadastrou nenhuma vaga.</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
