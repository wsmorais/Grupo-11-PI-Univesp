{% extends 'core/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 550px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning display-4 mb-3"></i>
        <h3 class="fw-bold text-dark mb-2">Excluir Oportunidade?</h3>
        <p class="text-muted mb-4">Tem certeza que deseja remover a vaga <strong>"{{ vaga.titulo }}"</strong>? Esta ação não pode ser desfeita.</p>

        <form method="POST" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger py-2 px-4 fw-semibold">Sim, Excluir</button>
            <a href="{% url 'minhas_oportunidades' %}" class="btn btn-outline-secondary py-2 px-4">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
