{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VoluntárioHub{% endblock %}</title>
    
    <!-- Bootstrap, Google Fonts, Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <!-- Navbar -->
    <header class="container py-4">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid p-0">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 text-green" href="#">
                    <span class="bg-brand-green p-2 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                        <i class="bi bi-geo-alt-fill fs-6"></i>
                    </span>
                    Voluntário<span class="text-orange">Hub</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom {% if request.resolver_match.url_name == 'home' %}nav-link-active{% endif %}" href="{% url 'home' %}">Início</a></li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom {% if request.resolver_match.url_name == 'cadastrar_voluntario' %}nav-link-active{% endif %}" href="{% url 'cadastrar_voluntario' %}">Voluntários</a></li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom {% if request.resolver_match.url_name == 'listar_ongs' %}nav-link-active{% endif %}" href="{% url 'listar_ongs' %}">ONGs</a></li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">Oportunidades</a></li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">Histórias</a></li>
                    </ul>
                </div>
                <div class="d-none d-lg-flex align-items-center gap-3">
                    <a href="/admin/" class="text-decoration-none text-dark">Entrar</a>
                    <a href="#" class="btn btn-orange">Cadastrar-se</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo dinâmico -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
