{% extends 'core/base.html' %}

{% block title %}Login - VoluntárioHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="fw-bold text-green mb-3 text-center">Entrar</h3>

                <form method="POST">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-medium">Usuário</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-medium">Senha</label>
                        {{ form.password }}
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-green py-2 fw-semibold">Entrar</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Ainda não tem conta? <a href="{% url 'cadastrar_voluntario' %}" class="text-orange fw-bold">Cadastre-se</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.classList.add('form-control');
        });
    });
</script>
{% endblock %}
