{% extends 'core/base.html' %}
{% load bootstrap4 %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h2 class="card-title text-center mb-2 text-primary fw-bold">Editar Meu Perfil</h2>
                    <p class="text-muted text-center mb-4">Atualize suas informações pessoais, contato e foto de perfil</p>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        {# Renderiza todos os campos automaticamente com as classes do Bootstrap #}
                        {% bootstrap_form form %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success py-2 fw-semibold">Salvar Alterações</button>
                            <a href="{% url 'listar_ongs' %}" class="btn btn-outline-secondary py-2">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
